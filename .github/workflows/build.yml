name: Build Native Engine & Renderer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 32-bit Multilib & Python Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib make python3 python3-pefile \
            libc6-dev-i386 libsdl2-dev:i386 libgl-dev:i386 libx11-dev:i386 nasm

      - name: Build Engine Host (lithtech_linux)
        run: |
          EXE_PATH=$(find . -maxdepth 3 -iname "lithtechreal.exe" -o -iname "lithtech.exe" | head -n 1)
          export LT_EXE="$(pwd)/${EXE_PATH#./}"
          echo "Using LT_EXE=$LT_EXE"
          cd lt_re
          python3 build_images.py
          cd linux
          bash build_linux.sh

      - name: Build Native Renderer (opengl.ren)
        run: |
          cd port
          make -j$(nproc)

      - name: Upload Native Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-binaries
          path: |
            lt_re/linux/lithtech_linux
            port/opengl.ren
